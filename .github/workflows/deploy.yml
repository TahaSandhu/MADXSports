name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy
        run: |
          cd frontend
          vercel --prod --token=${{ secrets.VERCEL_TOKEN }}